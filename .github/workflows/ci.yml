name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHIX_CACHE: kaiba-provisioning

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Formatting and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          github_access_token: ${{ github.token }}

      - name: Check formatting
        run: nix --accept-flake-config fmt -- --ci

      - name: Test the inert Ubuntu signing-gate deployment
        run: tests/deployment/ubuntu_signing_gate_test.sh

      - name: Test release candidate source and provenance checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/release-candidate -p 'test_*.py' -v

      - name: Check that the lock file is unchanged
        run: git diff --exit-code -- flake.lock

  x86_64_core:
    name: x86_64 Nix checks (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # The verifier checks boot NixOS guests and is marked with Nix's
          # `kvm` system feature. Expose the hosted runner's KVM device and
          # advertise that feature to the Nix daemon.
          enable_kvm: true
          github_access_token: ${{ github.token }}

      - name: Configure binary caches (read-only)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          extraPullNames: nixos-raspberrypi
          skipPush: true

      - name: Configure binary cache writes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          extraPullNames: nixos-raspberrypi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The Cachix action pushes build outputs in its post step. This small,
      # synchronous round trip makes a green trusted-branch build prove that
      # the configured token can write to the intended cache before expensive
      # checks begin.
      - name: Verify Cachix write access and read-back
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo '::error::CACHIX_AUTH_TOKEN is required for main-branch cache writes'
            exit 1
          fi

          cache_probe_file="$(mktemp "$RUNNER_TEMP/cachix-write-probe.XXXXXX")"
          printf '%s\n' "$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" > "$cache_probe_file"
          cache_probe_path="$(nix store add-file "$cache_probe_file")"
          cachix push "$CACHIX_CACHE" "$cache_probe_path"

          for _ in 1 2 3 4 5 6; do
            if nix path-info \
              --refresh \
              --store "https://${CACHIX_CACHE}.cachix.org" \
              "$cache_probe_path"
            then
              exit 0
            fi
            sleep 2
          done

          echo '::error::Cachix accepted the upload but the path could not be read back'
          exit 1

      # Fail on Go regressions before realizing the broader package/VM graph.
      # flake check reuses this exact result in the same runner's Nix store.
      - name: Run Go unit tests
        run: nix --accept-flake-config build -L --no-link .#checks.x86_64-linux.unit

      - name: Build x86_64 checks
        run: nix --accept-flake-config flake check -L

      # Realize configured outputs as integration coverage, including on the
      # prospective PR merge revision. Operators obtain artifacts for signing
      # only from the separately selected release-candidate source revision.
      - name: Check the configured x86_64 signing runtime
        run: |
          nix --accept-flake-config build -L --no-link \
            .#packages.x86_64-linux.kaiba-rpi5-stable-campaign-development-signing \
            .#packages.x86_64-linux.kaiba-rpi5-stable-verifier-development-signing \
            .#packages.x86_64-linux.kaiba-rpi5-native-offline-development-signing

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage the provisioning-station site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          pages_path="$(
            nix --accept-flake-config build \
              --no-link \
              --print-out-paths \
              .#packages.x86_64-linux.kaiba-provision-station-pages
          )"
          install -d _site
          cp -R --dereference "$pages_path"/. _site/
          for asset in \
            index.html \
            styles.css \
            transport.js \
            app.js \
            runtime-config.json \
            workflow-graph.json
          do
            test -s "_site/$asset"
          done
          test -z "$(find _site -type l -print -quit)"

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Preserve the existing required-check context while failing closed unless
  # both x86 and ARM checks, including configured operator outputs, pass.
  x86_64:
    name: x86_64 Nix checks
    if: always()
    needs:
      - x86_64_core
      - aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the x86_64 and native ARM64 lanes
        env:
          CORE_RESULT: ${{ needs.x86_64_core.result }}
          ARM_RESULT: ${{ needs.aarch64.result }}
        run: |
          if [ "$CORE_RESULT" != success ] || [ "$ARM_RESULT" != success ]; then
            echo "::error::core=$CORE_RESULT arm=$ARM_RESULT"
            exit 1
          fi

  aarch64:
    name: Native ARM64 checks and operator packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          # GitHub's native ARM64 runners do not expose KVM; the AArch64 VM
          # check uses the NixOS test framework's QEMU TCG fallback.
          enable_kvm: false
          github_access_token: ${{ github.token }}

      - name: Configure binary caches (read-only)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          extraPullNames: nixos-raspberrypi
          skipPush: true

      - name: Configure binary cache writes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          extraPullNames: nixos-raspberrypi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The hosted ARM64 runner currently falls back to TCG for NixOS VM
      # tests. Running the VM checks alongside kernel or filesystem-image
      # builds can starve the guest long enough to hit the test driver's fixed
      # shell-connect limit. Build the large ARM64 checks one at a time; the
      # full check below then reuses the outputs.
      - name: Build large ARM64 checks without build contention
        run: |
          nix --accept-flake-config build -L --no-link \
            .#checks.aarch64-linux.stable-verifier-aarch64-kexec-vm
          nix --accept-flake-config build -L --no-link \
            .#checks.aarch64-linux.stable-handoff-aarch64-kexec-file-vm
          nix --accept-flake-config build -L --no-link \
            .#checks.aarch64-linux.device-secret-target-luks-vm
          nix --accept-flake-config build -L --no-link \
            .#checks.aarch64-linux.device-secret-execution-vm
          nix --accept-flake-config build -L --no-link \
            .#checks.aarch64-linux.stable-campaign-provisioner-unsigned-artifacts
          nix --accept-flake-config build -L --no-link \
            .#checks.aarch64-linux.device-secret-target-artifacts

      # Public configured outputs need realization coverage beyond fixtures.
      # A PR's synthetic merge revision is an integration input, not the source
      # for operator approval. Main pushes also populate the trusted cache.
      - name: Check the configured native ARM signing lineage and runtime
        run: |
          nix --accept-flake-config build -L --no-link \
            .#packages.aarch64-linux.kaiba-rpi5-stable-campaign-development-signing \
            .#packages.aarch64-linux.kaiba-rpi5-stable-verifier-development-signing \
            .#packages.aarch64-linux.kaiba-rpi5-native-offline-development-signing \
            .#packages.aarch64-linux.kaiba-rpi5-stable-campaign-provisioner-signing-plan

      - name: Build remaining ARM64 checks and operator-facing packages
        run: nix --accept-flake-config flake check -L

      - name: Rehearse the native unsigned device-secret export
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/scripts/device_secret_candidate.py rehearse \
            --repository . --output "$RUNNER_TEMP/device-secret-export-rehearsal"
          cat "$RUNNER_TEMP/device-secret-export-rehearsal/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Export the tested native read-only metadata companion
        run: |
          test "$(uname -m)" = aarch64
          probe_package="$(nix --accept-flake-config build --no-link --print-out-paths .#kaiba-device-secret-capabilities)"
          export METADATA_PACKAGE="$probe_package"
          export METADATA_EXPORT="$RUNNER_TEMP/device-secret-metadata"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          output = pathlib.Path(os.environ["METADATA_EXPORT"])
          output.mkdir()
          source = pathlib.Path(os.environ["METADATA_PACKAGE"]) / "bin/kaiba-device-secret-metadata"
          target = output / source.name
          shutil.copyfile(source, target)
          target.chmod(0o555)
          (output / "build.json").write_text(json.dumps({
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "system": "aarch64-linux",
              "store_path": str(source.resolve()),
              "sha256": hashlib.sha256(target.read_bytes()).hexdigest(),
              "hardware_observation": False,
          }, indent=2) + "\n")
          PY

      - name: Upload the native read-only metadata companion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-secret-metadata-${{ github.sha }}-aarch64-linux
          path: ${{ runner.temp }}/device-secret-metadata/
          if-no-files-found: error
          retention-days: 30

  pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - fast-checks
      - x86_64
      - aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
