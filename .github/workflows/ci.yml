name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, Go tests, and x86_64 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Check formatting
        run: nix --accept-flake-config fmt -- --ci

      - name: Run Go tests
        env:
          TMPDIR: /tmp
        run: go test ./...

      - name: Test the inert Ubuntu signing-gate deployment
        run: tests/deployment/ubuntu_signing_gate_test.sh

      - name: Evaluate every flake system
        run: |
          nix --accept-flake-config flake check --all-systems --no-build -L
          git diff --exit-code -- flake.lock

      - name: Build x86_64 checks
        run: nix --accept-flake-config flake check -L

  aarch64:
    name: Native ARM64 checks and operator packages
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org https://nixos-kaiba-network.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI= nixos-kaiba-network.cachix.org-1:BCAt/P9Fo2JFexLB4T7eB3o0csSQI/Dy+hx+3RwzA8U=
          github_access_token: ${{ github.token }}

      - name: Build ARM64 checks
        run: nix --accept-flake-config flake check -L

      - name: Build operator-facing packages
        run: |
          nix --accept-flake-config build --no-link -L \
            .#packages.aarch64-linux.kaiba-provision \
            .#packages.aarch64-linux.kaiba-provision-station \
            .#packages.aarch64-linux.kaiba-provision-station-demo \
            .#packages.aarch64-linux.kaiba-provision-station-pages \
            .#packages.aarch64-linux.provisioning-test-result
