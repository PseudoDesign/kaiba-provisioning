name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Formatting, Go tests, and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          github_access_token: ${{ github.token }}

      - name: Configure binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kaiba-provisioning
          extraPullNames: nixos-raspberrypi
          skipPush: true

      - name: Check formatting
        run: nix --accept-flake-config fmt -- --ci

      - name: Run Go tests
        env:
          TMPDIR: /tmp
        run: go test ./...

      - name: Test the inert Ubuntu signing-gate deployment
        run: tests/deployment/ubuntu_signing_gate_test.sh

      - name: Check that the lock file is unchanged
        run: git diff --exit-code -- flake.lock

  x86_64:
    name: x86_64 Nix checks
    needs: fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          github_access_token: ${{ github.token }}

      - name: Configure binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kaiba-provisioning
          extraPullNames: nixos-raspberrypi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build x86_64 checks
        run: nix --accept-flake-config flake check -L

  aarch64:
    name: Native ARM64 checks and operator packages
    needs: fast-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false
          github_access_token: ${{ github.token }}

      - name: Configure binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kaiba-provisioning
          extraPullNames: nixos-raspberrypi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build ARM64 checks and operator-facing packages
        run: nix --accept-flake-config flake check -L
