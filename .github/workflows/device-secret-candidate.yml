name: Device-secret candidate
run-name: Unsigned device-secret candidate ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase commit SHA already on main
        required: true
        type: string
      experiment_json:
        description: Public experiment JSON only; visible in Actions and exported artifacts
        required: true
        type: string
      experiment_sha256:
        description: SHA-256 of the exact experiment_json bytes
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Validate source and public experiment bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out the workflow revision and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable main source and closed public inputs
        id: source
        env:
          CANDIDATE_SHA: ${{ inputs.source_sha }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
          EXPERIMENT_JSON: ${{ inputs.experiment_json }}
          EXPERIMENT_SHA256: ${{ inputs.experiment_sha256 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/scripts/device_secret_candidate.py select-source \
            --repository . --source-sha "$CANDIDATE_SHA" \
            --main-sha "$DISPATCH_MAIN_SHA" --workflow-ref "$GITHUB_REF" \
            >> "$GITHUB_OUTPUT"

  build:
    name: Build and export unsigned experiment (native ARM)
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          persist-credentials: false

      - name: Check out the selected experiment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Configure binary caches (read-only)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kaiba-provisioning
          extraPullNames: nixos-raspberrypi
          skipPush: true

      - name: Build and export the unsigned experiment and review
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.sha }}
          DISPATCH_MAIN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPERIMENT_JSON: ${{ inputs.experiment_json }}
          EXPERIMENT_SHA256: ${{ inputs.experiment_sha256 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 workflow/.github/scripts/device_secret_candidate.py build \
            --repository candidate --source-sha "$CANDIDATE_SHA" \
            --main-sha "$DISPATCH_MAIN_SHA" --workflow-sha "$WORKFLOW_SHA" \
            --output "$RUNNER_TEMP/device-secret-candidate"
          cat "$RUNNER_TEMP/device-secret-candidate/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public unsigned candidate and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-secret-candidate-${{ needs.source.outputs.sha }}-${{ inputs.experiment_sha256 }}-aarch64-linux
          path: ${{ runner.temp }}/device-secret-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
